<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | Campus Companion</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="notifications.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">🎓</div>
            Campus Companion
        </div>
        <div class="sidebar-user">
            <div class="sidebar-user-avatar" id="sidebar-avatar">JD</div>
            <div class="sidebar-user-info">
                <p>Logged in as</p>
                <strong id="sidebar-name">Dr. John Doe</strong>
                <small id="sidebar-dept">Computer Science</small>
            </div>
        </div>
        <nav>
            <p class="sidebar-section-label">Main Menu</p>
            <ul class="sidebar-nav stagger">
                <li><a href="../dashboard/dashboard.html"><span class="nav-icon">🏠</span> Dashboard</a></li>
                <li><a href="../materials/materials.html"><span class="nav-icon">📁</span> Materials</a></li>
                <li><a href="../announcements/announcements.html"><span class="nav-icon">📢</span> Announcements</a></li>
            </ul>
            <p class="sidebar-section-label">Account</p>
            <ul class="sidebar-nav stagger">
                <li><a href="../profile/profile.html"><span class="nav-icon">👤</span> Profile</a></li>
                <li><a href="notifications.html" class="active"><span class="nav-icon">🔔</span> Notifications</a></li>
            </ul>
        </nav>
        <div class="sidebar-footer">
            <a href="../settings/settings.html"><span class="nav-icon">⚙️</span> Settings</a>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <div class="topbar-left">
                <h2>Notifications</h2>
                <p>Stay up to date with your teaching activity</p>
            </div>
            <div class="topbar-right">
                <a href="notifications.html" class="topbar-icon-btn is-active" aria-label="Notifications">
                    🔔 <span class="notif-badge" id="notif-count">3</span>
                </a>
                <a href="../profile/profile.html" class="topbar-avatar" id="topbar-avatar" aria-label="Open profile">JD</a>
            </div>
        </header>

        <section class="content">
            <div class="notif-header">
                <div>
                    <p class="eyebrow">Activity centre</p>
                    <h3 id="unread-label">3 unread notifications</h3>
                </div>
                <button class="btn-mark-all" id="mark-all-btn">Mark all as read</button>
            </div>
            <div class="notif-list" id="notif-list"></div>
        </section>
    </main>
</div>

<div class="toast" id="toast"></div>
<script src="../portal.js"></script>
<script src="notifications.js"></script>
</body>
</html>
